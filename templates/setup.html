<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{ panel_name }} · Setup</title>
<link rel="icon" href="/static/img/favicon.svg?v={{ app_version }}" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/fonts.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/css/theme.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/css/dashboard.css?v={{ app_version }}">
</head>
<body>
{% include "_icons.html" %}

<div class="auth-top">
  <div class="lang-toggle">
    <button type="button" data-lang="fa">FA</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <button class="icon-btn" id="themeToggle" title="theme"><svg><use href="#icon-moon"/></svg></button>
</div>

<div class="auth-shell">
  <div class="auth-card">
    <svg class="auth-logo"><use href="#brand-mark"/></svg>
    <div class="brand-title">{{ panel_name }}</div>
    <div class="brand-sub" data-i18n="setup_subtitle">ساخت حساب مدیر — این صفحه فقط یک‌بار نمایش داده می‌شود</div>

    <form id="setupForm">
      <div class="field">
        <label data-i18n="login_username">نام کاربری</label>
        <div class="input-wrap">
          <svg class="input-icon"><use href="#icon-user-circle"/></svg>
          <input class="input" type="text" id="username" required autocomplete="username" autofocus>
        </div>
        <div class="small muted mt-8" data-i18n="setup_username_hint">۳ تا ۳۲ کاراکتر، فقط حروف انگلیسی، عدد و زیرخط</div>
      </div>

      <div class="field">
        <label data-i18n="login_password">رمز عبور</label>
        <div class="input-wrap">
          <svg class="input-icon"><use href="#icon-key"/></svg>
          <input class="input" type="password" id="password" required autocomplete="new-password">
          <button type="button" class="input-toggle" data-toggle-for="password" aria-label="show password">
            <svg width="17" height="17"><use href="#icon-eye"/></svg>
          </button>
        </div>
        <div class="small muted mt-8" data-i18n="setup_password_hint">حداقل ۸ کاراکتر</div>
      </div>

      <div class="field">
        <label data-i18n="setup_password_confirm">تکرار رمز عبور</label>
        <div class="input-wrap">
          <svg class="input-icon"><use href="#icon-key"/></svg>
          <input class="input" type="password" id="password2" required autocomplete="new-password">
          <button type="button" class="input-toggle" data-toggle-for="password2" aria-label="show password">
            <svg width="17" height="17"><use href="#icon-eye"/></svg>
          </button>
        </div>
      </div>

      <div class="inline-error" id="mismatchError" data-i18n="setup_mismatch">رمزهای عبور یکسان نیستند</div>

      <button type="submit" class="btn btn-primary w-full mt-16" id="setupBtn">
        <span data-i18n="setup_btn">ساخت حساب</span>
      </button>
    </form>
  </div>
</div>

<script src="/static/js/i18n.js?v={{ app_version }}"></script>
<script src="/static/js/common.js?v={{ app_version }}"></script>
<script src="/static/js/setup.js?v={{ app_version }}"></script>
</body>
</html>
