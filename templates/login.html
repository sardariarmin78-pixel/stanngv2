<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>{{ panel_name }} · Login</title>
<link rel="icon" href="/static/img/favicon.svg?v={{ app_version }}" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/fonts.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/css/theme.css?v={{ app_version }}">
<link rel="stylesheet" href="/static/css/dashboard.css?v={{ app_version }}">
</head>
<body>
{% include "_icons.html" %}

<div class="auth-top">
  <div class="lang-toggle">
    <button type="button" data-lang="fa">FA</button>
    <button type="button" data-lang="en">EN</button>
  </div>
  <button class="icon-btn" id="themeToggle" title="theme"><svg><use href="#icon-moon"/></svg></button>
</div>

<a class="telegram-fab" href="{{ telegram_contact }}" target="_blank" rel="noopener" title="پشتیبانی / Support">
  <svg><use href="#icon-telegram"/></svg>
</a>

<div class="auth-shell">
  <div class="auth-card">
    <svg class="auth-logo"><use href="#brand-mark"/></svg>
    <div class="brand-title">{{ panel_name }}</div>
    <div class="brand-sub" data-i18n="login_subtitle">برای ادامه وارد شوید</div>

    <form id="loginForm">
      <!-- step 1: credentials -->
      <div id="loginStep1">
        <div class="field">
          <label data-i18n="login_username">نام کاربری</label>
          <div class="input-wrap">
            <svg class="input-icon"><use href="#icon-user-circle"/></svg>
            <input class="input" type="text" id="username" required autocomplete="username" autofocus>
          </div>
        </div>
        <div class="field">
          <label data-i18n="login_password">رمز عبور</label>
          <div class="input-wrap">
            <svg class="input-icon"><use href="#icon-key"/></svg>
            <input class="input" type="password" id="password" required autocomplete="current-password">
            <button type="button" class="input-toggle" data-toggle-for="password" aria-label="show password">
              <svg width="17" height="17"><use href="#icon-eye"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- step 2: second factor, revealed only when the server asks for it -->
      <div id="loginStep2" style="display:none;">
        <div class="field">
          <label data-i18n="twofa_enter_code">کد ۶ رقمی</label>
          <input class="input mono" type="text" id="twofaCode" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="11" placeholder="000000" style="direction:ltr; text-align:center; letter-spacing:.3em;">
          <div class="small muted mt-8" data-i18n="twofa_or_recovery">یا یکی از کدهای بازیابی خود را وارد کنید.</div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-full mt-8" id="loginBtn">
        <span data-i18n="login_btn">ورود</span>
      </button>
    </form>
  </div>
</div>

<script src="/static/js/i18n.js?v={{ app_version }}"></script>
<script src="/static/js/common.js?v={{ app_version }}"></script>
<script src="/static/js/login.js?v={{ app_version }}"></script>
</body>
</html>
