services:
  - type: web
    name: peyk
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 8000
      # Render terminates TLS at its own router: exactly one trusted hop.
      - key: PEYK_PROXY_HOPS
        value: 1
    autoDeploy: true
