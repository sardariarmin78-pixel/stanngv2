# Front for the Peyk container.
#
# nginx owns the public port and splits by path: proxy transports go to the
# matching xray inbound on loopback, everything else to the Python panel.
# entrypoint.sh rewrites `listen` with the port the platform assigns.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    access_log off;

    # The panel sits behind this, so pass the client address through rather
    # than letting it see nginx. PEYK_PROXY_HOPS accounts for the extra hop.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen NGINX_PORT;
        server_name _;

        # Proxied traffic is long-lived and mostly idle between bursts;
        # the default 60s read timeout would cut working tunnels.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        location /vl-ws {
            proxy_pass http://127.0.0.1:10001;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /vm-ws {
            proxy_pass http://127.0.0.1:10002;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # XHTTP is plain HTTP request/response, not an Upgrade handshake.
        location /vl-xhttp {
            proxy_pass http://127.0.0.1:10004;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # The panel, including its own /ws/{uid} fallback relay.
        location / {
            proxy_pass http://127.0.0.1:10000;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
